# Render deployment configuration
# https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: dramazone-vip-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CUSTOMER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dramazone_vip
      - key: ADMIN_TELEGRAM_IDS
        value: "1673861706,1655754454"
      - key: ADMIN_USERNAME
        value: myatnyein21
      - key: KPAY_PHONE
        value: "09777720344"
      - key: KPAY_ACCOUNT_NAME
        value: "Myat Nyein Ngon"
      - key: WAVE_PHONE
        value: "09777720344"
      - key: WAVE_ACCOUNT_NAME
        value: "Myat Nyein Ngon"
      - key: CUSTOMER_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_WEBHOOK_SECRET
        sync: false
      - key: BASE_WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
